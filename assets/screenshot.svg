  <rect x="120" y="30" width="520" height="24" rx="12" fill="#fff" stroke="#e2e4e9"/>
  <text x="136" y="46" font-size="12" fill="#6b7280">example.com/the-long-read</text>
  <!-- toolbar icon -->
  <rect x="700" y="30" width="24" height="24" rx="6" fill="#6366f1"/>
  <rect x="706" y="36" width="12" height="3" rx="1.5" fill="#fff"/><rect x="706" y="42" width="12" height="2" rx="1" fill="#c7d2fe"/><rect x="706" y="47" width="9" height="2" rx="1" fill="#c7d2fe"/>
  <!-- article -->
  <text x="56" y="110" font-size="22" font-weight="700" fill="#111827">The Long Read</text>
  <g fill="#9aa1ad">
    <rect x="56" y="130" width="430" height="9" rx="4"/><rect x="56" y="150" width="470" height="9" rx="4"/>
    <rect x="56" y="170" width="410" height="9" rx="4"/><rect x="56" y="190" width="450" height="9" rx="4"/>
    <rect x="56" y="210" width="380" height="9" rx="4"/><rect x="56" y="230" width="440" height="9" rx="4"/>
