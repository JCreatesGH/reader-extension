<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="system-ui,Segoe UI,Helvetica,sans-serif">
  <rect width="800" height="430" fill="#e9ebf0"/>
  <!-- browser window -->
  <rect x="20" y="20" width="760" height="390" rx="10" fill="#fff" stroke="#d7dae0"/>
  <rect x="20" y="20" width="760" height="44" rx="10" fill="#f3f4f7"/>
