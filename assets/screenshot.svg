  <text x="56" y="370" font-size="12.5" fill="#6b7280" font-family="SFMono-Regular,monospace">Manifest V3 · activeTab only · tested reading-time &amp; readability scoring · ✓ 8 tests</text>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/></filter></defs>
